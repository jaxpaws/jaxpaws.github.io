<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Contact Information</title>
        <script src="header.js" defer></script>
        <script src="footer.js" defer></script>
        <link rel="stylesheet" href="globals.css">
        <link rel="stylesheet" href="connect.css">
        <script src="https://kit.fontawesome.com/b1b7ad65ab.js" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="content-wrapper">
            <jax-header current="connect"></jax-header>
            <main>
                <section id="contact-section">
                    <div id="header">
                        <img id="portrait" src="assets/portrait-photo.jpg" />
                        <div>
                            <h1>Connect with Me</h1>
                            <p>Let's discover how I can improve your life</p>
                        </div>
                    </div>
                    <div class="section-body">
                        <div id="links">
                            <a id="email" class="link-anchor" href="mailto:jacksonbare@gmail.com">
                                <div class="link-with-icon">
                                    <i id="envelope" class="fa-regular fa-envelope fa-xl"></i>
                                    jacksonbare@gmail.com
                                </div>
                            </a>
                            <a id="linkedin" class="link-anchor" id="linkedin-link" href="https://www.linkedin.com/in/jacksonbare/">
                                <div class="link-with-icon">
                                    <i class="fa-brands fa-linkedin-in fa-xl"></i>
                                    linkedin.com/in/jacksonbare/
                                </div>
                            </a>
                            <a id="github" class="link-anchor" id="github-link" href="https://github.com/jaxpaws">
                                <div class="link-with-icon">
                                    <i class="fa-brands fa-github fa-xl"></i>
                                    github.com/jaxpaws
                                </div>
                            </a>
                        </div>
                    </div>
                </section>
            </main>
            <jax-footer></jax-footer>
        </div>
    </body>
</html>
